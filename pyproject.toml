[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-lens"
version = "0.6.0"
description = "Market Lens — Deterministic Price Transparency Protocol (DKP-PTL-REG v0.6 Reference Implementation)"
readme = "README.md"
license = {text = "Market Lens Non-Commercial Source License v1.0"}
requires-python = ">=3.10"
authors = [
    {name = "Igor Opolinsky"}
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
include = ["client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
